name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build
          cmake --build build
      - name: Sanity test (loopback)
        run: |
          ./build/linktest --auto 127.0.0.1 -s &
          sleep 1
          ./build/linktest --auto 127.0.0.1 -c | tee result.txt
          wait
          grep -q "Mbps" result.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Sanity test (loopback)
        shell: cmd
        run: |
          start /B build\Release\linktest.exe --auto 127.0.0.1 -s
          timeout /t 2 >nul
          build\Release\linktest.exe --auto 127.0.0.1 -c

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build
          cmake --build build
      - name: Sanity test (loopback)
        run: |
          ./build/linktest --auto 127.0.0.1 -s &
          sleep 1
          ./build/linktest --auto 127.0.0.1 -c | tee result.txt
          wait
          grep -q "Mbps" result.txt
